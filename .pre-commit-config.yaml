repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff CI installs (pyproject allows >=0.4,<1.0, so
    # CI gets the latest). At v0.4.10 the hook formatted code that CI's newer
    # `ruff format --check` then rejected -- the hook has to be no older than
    # what the gate runs. API Verity Lab hit and fixed the same drift.
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Gates only when a commit changes the environment contract -- a
      # lockfile, manifest, toolchain pin, workflow, container definition or
      # policy. A source-only commit exits in well under a second without
      # scanning anything.
      #
      # `--scope machine`, the default, is deliberately NOT used here: it fails
      # on any blocker anywhere, so a stopped Docker daemon would block every
      # commit and this hook would be deleted within a week.
      - id: devrepro-contract-guard
        name: devrepro environment-contract guard
        entry: python -m devrepro guard --scope changed --quiet
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy (strict)
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false