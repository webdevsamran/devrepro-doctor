# Rename `devrepro-rulepack-example` and the references to
# `devrepro_rulepack_example` below, and this is your pack.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devrepro-rulepack-example"
version = "0.1.0"
description = "An example devrepro rule pack"
requires-python = ">=3.11"
dependencies = ["devrepro-doctor"]

# The entry point is the entire registration mechanism. There is no registry to
# submit to and nothing to approve: install the package and `devrepro plugins`
# lists it.
[project.entry-points."devrepro.rules"]
example = "devrepro_rulepack_example:evaluate"

[tool.hatch.build.targets.wheel]
packages = ["src/devrepro_rulepack_example"]
