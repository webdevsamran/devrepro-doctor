# Policy for this repository, checked with `devrepro check --policy .devrepro.toml`.
#
# The project ships a policy engine and did not run it against itself. Its own
# `devrepro ci-diff` already reports a real drift here (CI pins Node 22, this
# machine has 24), which is exactly what a policy is for.
#
# Ranges mirror .github/workflows/ci.yml. If the two disagree, CI wins and this
# file is the bug -- the same rule AGENTS.md sets for its command list.

[supported_os]
windows = true
linux = true
macos = true

[required_runtimes]
# CI runs 3.11-3.14 across three operating systems; pyproject sets the floor.
python = ">=3.11"

[required_tools]
git = "*"

[optional_tools]
# The frontend job uses Node 22. Optional because the Python package builds,
# tests and installs without it.
node = ">=22"
npm = "*"
# Container diagnostics have their own tests and do not require a live daemon.
docker = "*"

[containers]
# A devcontainer is not committed; the score reports that as a gap rather than
# this policy failing the build over it.
require_devcontainer = false
require_compose = false
