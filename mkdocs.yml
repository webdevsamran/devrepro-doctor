site_name: DevRepro Doctor
site_description: >
  Cross-platform diagnostics, reproducibility auditing and safe repair
  planning for developer machines, project toolchains, SDKs, containers
  and build dependencies.
site_url: https://webdevsamran.github.io/devrepro-doctor/
repo_url: https://github.com/webdevsamran/devrepro-doctor
repo_name: webdevsamran/devrepro-doctor

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
  icon:
    logo: material/stethoscope

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Interoperability: interop.md
  - Product gaps: product-gaps.md
  - Competitive analysis: competitive-analysis.md
  - Guides:
      - Agent readiness: AGENT-READINESS.md
      - GitHub Actions & SARIF: ci-github-actions.md
      - Self-hosted server: SERVER.md
      - Plugins: PLUGINS.md
      - Privacy: PRIVACY.md
      - Exit codes: EXIT-CODES.md
      - MCP exposure: MCP-EXPOSURE.md
      - Releasing: release.md
  - Project:
      - Contributing: contributing.md
      - Security policy: security.md
      - Changelog: changelog.md
      - Code of conduct: code-of-conduct.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  links:
    # Root documents (README, ARCHITECTURE, CONTRIBUTING...) are included into
    # this site by snippet and carry links written relative to the repository
    # root, where they are correct and where most people read them. Inside the
    # site those targets sit outside the docs tree, so mkdocs reports them as
    # not-found and --strict aborts.
    #
    # Downgraded to info deliberately, and paired with `check_paths: true`
    # above, which is the check that actually matters: a snippet that cannot be
    # found now fails the build. It previously did not. With check_paths off,
    # all nine includes in this site silently resolved to nothing, and the
    # published pages for Architecture, Roadmap, Contributing, Security,
    # Interop, Product gaps, Changelog and Code of conduct were empty while the
    # build stayed green.
    not_found: info
