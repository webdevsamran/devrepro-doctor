name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  provenance:
    name: Build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless Sigstore, via this workflow's own identity
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Attested here rather than in the release job on purpose: SLSA
      # provenance is a claim about *the build*, and it has to be made where
      # the build happened. Made later it would be a claim about files that
      # arrived from somewhere.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: devrepro-doctor-sbom.spdx.json

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate SHA256SUMS
        run: |
          cd dist
          # `sha256sum *` fails on a directory, and the SBOM artifact lands
          # here too. Name only the regular files this build produced, sorted
          # so the file is reproducible.
          sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS | sort) > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS

  github-release:
    name: GitHub Release
    needs: [build, sbom, checksums, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # keyless Sigstore, via this workflow's own identity
    steps:
      # `gh release create` shells out to git for the repository context.
      # Without a checkout it fails with "fatal: not a git repository", which
      # is what happened on the first tag local-ai-hardware-bench ever pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: dist/
      # SHA256SUMS proves the files match a list published in the same release
      # by the same person. It answers "did this download corrupt" and nothing
      # about who built it. A keyless signature answers the second question,
      # and there is no key to rotate or leak because the identity is this
      # workflow's own OIDC token.
      #
      # The cost is that every signature lands in a public transparency log.
      # For public artefacts from a public repository that is not a cost -- and
      # it is the same trade `devrepro attest` refuses to make on a user's
      # behalf, because there it would publish a record of somebody's machine.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign every release artifact
        env:
          COSIGN_YES: "true"
        run: |
          for file in dist/*; do
            [ -f "$file" ] || continue
            case "$file" in *.sig|*.pem) continue;; esac
            cosign sign-blob "$file"               --output-signature "$file.sig"               --output-certificate "$file.pem"
          done

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*             --title "DevRepro Doctor $TAG"             --generate-notes

  publish:
    name: Publish to PyPI (only if Trusted Publishing is configured)
    needs: [build, sbom, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing / provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Guarded rather than unconditional. Publishing needs a Trusted Publisher
      # registered for this project on pypi.org, which is a form on the account
      # that owns the name and cannot be created from a repository. Without the
      # guard a tagged release fails here even though everything else
      # succeeded, and a red release is indistinguishable from a broken one.
      - name: Is Trusted Publishing configured?
        id: guard
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          if [ "${PUBLISH_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PyPI upload: set the repository variable PUBLISH_ENABLED=true after registering a Trusted Publisher (owner webdevsamran, repo devrepro-doctor, workflow release.yml, environment pypi)."
          fi
      - name: Publish to PyPI (trusted publisher)
        if: steps.guard.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
