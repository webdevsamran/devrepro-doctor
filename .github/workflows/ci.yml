name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check devrepro tests scripts
      - name: Format check
        run: ruff format --check devrepro tests scripts
      - name: Type check (mypy)
        run: mypy devrepro
      - name: Tests + coverage
        run: pytest -q --cov=devrepro --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
      - name: Schema validation
        # --check fails if the committed schemas have drifted from the models;
        # validate_schemas.py then proves they are well-formed, current and
        # actually validate an instance. It used to glob an empty directory
        # and pass unconditionally on all twelve matrix legs.
        run: |
          python scripts/generate_schemas.py --check
          python scripts/validate_schemas.py
      - name: Secret scan
        # The only secret check here was a local pre-commit `detect-private-key`
        # hook, which `git commit --no-verify` skips and CI never ran.
        run: python scripts/secret_scan.py
      - name: Pinned actions match their version comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_action_pins.py
      - name: Landscape table matches the fetched competitor data
        # The table states its own method ("fetched via the GitHub API")
        # but was typed by hand. In a sibling repo that drifted into
        # publishing that a live competitor's repo was gone.
        run: python scripts/generate_landscape.py --check
      - name: Rule catalogue docs match the catalogue
        # docs/RULES.md is generated from devrepro/rules/catalog.py. A
        # committed generated file without a drift gate is how documentation
        # starts lying.
        run: python scripts/generate_rule_docs.py --check
      - name: README example matches the real renderer
        # The README used to show a hand-written scan with a rule id no code
        # emits, under the caption "examples from actual scans". This renders a
        # fixture through the same function `devrepro doctor` calls and fails
        # if the committed block differs.
        run: python scripts/capture_readme_example.py --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # This repository ran pip-audit and nothing on the npm side, so half its
      # dependency surface was unexamined. local-ai-hardware-bench has audited
      # its frontend from the start.
      - name: npm audit (fail on high+)
        run: npm audit --audit-level=high
      - run: npm run build

  # Separate job, one browser, one runner. The vitest suite renders components
  # in jsdom, which never lays anything out -- so a lazy chunk that fails to
  # resolve, a colour below the contrast threshold, a scroll container no
  # keyboard can reach and a layout that overflows at 390px all passed it. Each
  # of those was real and each was found the day this job was added.
  e2e:
    name: Frontend e2e + accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt
      - name: Build docs (strict)
        run: mkdocs build --strict

  security-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package + audit tool
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: Audit installed dependencies
        # --skip-editable: the local devrepro-doctor package is not on PyPI yet
        run: pip-audit --skip-editable
