version: 2
updates:
  # Grouped updates keep the branch count low: one PR per ecosystem/group
  # instead of one PR per dependency, so temporary branches do not accumulate.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
      web-prod-deps:
        dependency-type: "production"
        patterns:
          - "*"
    open-pull-requests-limit: 2
    ignore:
      # TypeScript 7 is not installable here yet: typescript-eslint declares
      # `peer typescript@">=4.8.4 <6.1.0"`, and 8.69.0 is its latest release,
      # so `npm ci` fails with ERESOLVE before anything compiles. Dependabot
      # reopens this bump as soon as it is declined and will keep doing so
      # weekly. Remove once a typescript-eslint release supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1