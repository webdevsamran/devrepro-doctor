[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "devrepro-doctor"
version = "0.2.0"
description = "Cross-platform diagnostics, reproducibility auditing and safe repair planning for developer machines, project toolchains, SDKs, containers and build dependencies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "@webdevsamran" }]
keywords = [
  "diagnostics", "reproducibility", "developer-tools", "toolchain",
  "environment", "works-on-my-machine", "snapshots", "diff",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<16.0",
  "pydantic>=2.6,<3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Convenience meta-extra used by CI: pip install -e ".[dev]"
dev = ["devrepro-doctor[test,lint]"]
serve = ["flask>=3.0,<4.0", "uvicorn>=0.29,<1.0"]
secure = ["cryptography>=42.0,<51.0"]
test = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "hypothesis>=6.100,<7.0",
  "httpx>=0.27,<1.0",
  "flask>=3.0,<4.0",
  # Test-only. `devrepro init` writes a workflow and a pre-commit config, and
  # the tests parse them with a real YAML reader rather than trusting a regex.
  # It is deliberately not a runtime dependency: the agent-manifest reader in
  # devrepro/agents/ handles the small subset of YAML it needs by hand, so the
  # installed package still depends only on typer, rich and pydantic.
  "PyYAML>=6.0,<7.0",
]
lint = [
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<3.0",
  "types-toml; python_version < '3.11'",
]

[project.scripts]
devrepro = "devrepro.cli.app:main"

[project.urls]
Homepage = "https://github.com/webdevsamran/devrepro-doctor"
Repository = "https://github.com/webdevsamran/devrepro-doctor"
Issues = "https://github.com/webdevsamran/devrepro-doctor/issues"
Changelog = "https://github.com/webdevsamran/devrepro-doctor/blob/main/CHANGELOG.md"

# Plugin entry points (documented API surface)
[project.entry-points."devrepro.probes"]
# example: my_probe = "my_package.probes:MyProbe"

[project.entry-points."devrepro.rules"]
[project.entry-points."devrepro.remediations"]
[project.entry-points."devrepro.project_detectors"]
[project.entry-points."devrepro.exporters"]

[tool.hatch.build.targets.wheel]
packages = ["devrepro"]

[tool.hatch.build.targets.sdist]
include = ["devrepro", "tests", "schemas", "docs", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["devrepro", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "PTH",
  "RUF", "PL", "S", "D",
]
ignore = [
  "D203", "D213",          # conflicting docstring style rules
  "D101", "D102", "D103", "D105", "D107", "D205", "D400", "D401",
  # docstring presence is encouraged but not enforced per-symbol
  "PLR0913",               # many probe args are fine
  "PLR0911", "PLR0912", "PLR0915",  # CLI dispatch is intentionally branchy
  "PLR2004",               # magic values are readable in diagnostics code
  "PLC0415",               # lazy imports: fast CLI startup + optional deps
  "B008",                  # typer.Option() in defaults is the Typer idiom
  "S110", "S112",          # probe isolation intentionally swallows errors
  "S607",                  # probes intentionally call PATH tools by name
]

[tool.ruff.lint.per-file-ignores]
"scripts/check_docs_site.py" = ["S603", "RUF100"]
# Same shared-script situation: the gh endpoint is built from the hardcoded
# REPOS list above it, not from user input.
"scripts/fetch_competitor_meta.py" = ["S603", "S607", "RUF100"]
# Shared verbatim across the four sibling repositories, whose ruff
# rule sets differ: S310 must be suppressed where it is enabled, and
# that suppression must not read as unused (RUF100) where it is not.
"scripts/check_action_pins.py" = ["S310", "RUF100"]
"tests/*" = ["S101", "D", "PLR2004", "B017"]
"web/**" = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["devrepro"]

[[tool.mypy.overrides]]
module = ["uvicorn.*", "winreg", "cryptography.*"]
ignore_missing_imports = true

# winreg stubs are Windows-only in typeshed; inline ignores in
# devrepro/platforms/windows_extra.py are needed on Linux/macOS and unused on
# Windows, so suppress the unused-ignore warning for that module only.
[[tool.mypy.overrides]]
module = "devrepro.platforms.windows_extra"
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: long-running tests",
  "integration: tests that exercise multiple subsystems",
]

[tool.coverage.run]
source = ["devrepro"]
branch = true

[tool.coverage.report]
# Matches the --cov-fail-under=70 CI passes on the command line. Without it a
# local `pytest --cov` enforced nothing, so "CI runs the same suite" was not
# true of the gate, only of the tests.
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]